[project]
name = "service-peso-tugma-ai"
version = "0.1.0"
description = "FastAPI backend for peso-tugma-ai"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "email-validator>=2.2.0",
    "motor>=3.6.0",
    "beanie>=1.27.0",
    "pyjwt>=2.9.0",
    "python-multipart>=0.0.12",
    "httpx>=0.27.0",
    "bcrypt>=4.1",
    "sentence-transformers>=5.6.0",
    "scikit-learn>=1.9.0",
    "numpy>=2.5.1",
    "pymupdf>=1.24.0",
    "pytesseract>=0.3.13",
    "pillow>=10.4.0",
    "dateparser>=1.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "pre-commit>=4.6.0",
    "commitizen>=4.16.3",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

# sentence-transformers ships no type information; ignore its missing stubs so
# strict mode doesn't fail on the embedding-model import.
[[tool.mypy.overrides]]
module = ["sentence_transformers.*"]
ignore_missing_imports = true

# PyMuPDF (fitz), pytesseract, and dateparser ship no type stubs; the
# resume-extraction pipeline imports them, so ignore their missing stubs under
# strict mode.
[[tool.mypy.overrides]]
module = ["fitz.*", "pymupdf.*", "pytesseract.*", "dateparser.*"]
ignore_missing_imports = true
